plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.amardokan.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.amardokan.pro"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Google "Web client ID" (OAuth client of type Web, created by Firebase).
        // Passed from CI as -PwebClientId=... (GitHub secret GOOGLE_WEB_CLIENT_ID)
        // or set in local gradle.properties. It is a public identifier, not a secret key.
        def webClientId = project.findProperty("webClientId") ?: "REPLACE_WITH_WEB_CLIENT_ID"
        resValue "string", "default_web_client_id", webClientId
    }

    // A fixed debug keystore is committed so that every CI build has the SAME SHA-1
    // fingerprint. Google Sign-In only works when this SHA-1 is registered in Firebase.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }

    // The web app lives in /web and is packaged as Android assets (no copy step needed).
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../web']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Native Google sign-in (Credential Manager) -> ID token -> Firebase JS SDK
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
